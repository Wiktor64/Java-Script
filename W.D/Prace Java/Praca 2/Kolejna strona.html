<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Składania js </title>
</head>
<body>
<script>
// POSTINKREMENTACJA
let a = 5;
document.write("POSTINKREMENTACJA"+"<br/>");
document.write("Wartość przed a++:", a+"<br/>");
document.write("Wynik a++:", a++);
document.write("<br/>"+"Wartość po a++:", a);
// PREINKREMENTACJA
let b = 5;
document.write("<br/>"+"PREINKREMENTACJA"+"<br/>");
document.write("Wartość przed ++b:", b);
document.write("<br/>"+"Wynik ++b:", ++b);
document.write("<br/>"+"Wartość po ++b:", b);
</script>
</body>
</html>
